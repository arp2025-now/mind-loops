<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mind Loops" />
  <title>Mind Loops — אימון מנטלי יומי של 5 דקות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
:root {
  /* Vibrant & energetic — blue → teal → green */
  --bg: #f6fcfb;
  --bg-2: #e2f3ef;
  --bg-soft: #f1faf8;
  --card: #ffffff;
  --card-2: #f1faf8;
  --line: #dceeec;
  --line-2: #cbe7e3;
  --text: #0f2a33;
  --muted: #6b8a90;
  --primary: #0284c7;        /* blue */
  --primary-2: #0ea5e9;      /* sky blue */
  --primary-soft: #e0f2fe;
  --accent: #10b981;         /* green */
  --accent-soft: #d1fae5;
  --pink: #0d9488;           /* teal */
  --pink-soft: #ccfbf1;
  --gold: #0d9488;           /* gratitude accent (teal) */
  --gold-soft: #ccfbf1;
  --warn: #f59e0b;
  --danger: #ef4444;
  --radius: 22px;
  --radius-sm: 16px;
  --shadow: 0 18px 38px -18px rgba(2, 132, 199, 0.34);
  --shadow-sm: 0 8px 20px -12px rgba(2, 132, 199, 0.30);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(820px 520px at 88% -8%, #d6f7ee 0%, rgba(255,224,243,0) 60%),
    radial-gradient(760px 520px at 2% 4%, #d6efea 0%, rgba(230,224,255,0) 58%),
    radial-gradient(700px 600px at 50% 110%, #d3eefb 0%, rgba(220,236,255,0) 55%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }

/* ---------- Screens ---------- */
.screen { max-width: 480px; margin: 0 auto; padding: 40px 20px; }
.screen--center {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.brand { text-align: center; margin-bottom: 30px; }
.brand__logo {
  font-size: 40px; line-height: 1;
  width: 86px; height: 86px; margin: 0 auto;
  display: grid; place-items: center;
  background: linear-gradient(140deg, var(--primary) 0%, var(--pink) 100%);
  border-radius: 26px;
  box-shadow: 0 18px 30px -14px rgba(2, 132, 199, 0.55);
}
.brand__name { font-size: 36px; font-weight: 900; margin: 16px 0 8px; letter-spacing: -0.6px; }
.brand__tag { color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0 auto; max-width: 340px; }

/* ---------- Cards ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px;
  box-shadow: var(--shadow);
}
.card__title { margin: 0 0 18px; font-size: 22px; font-weight: 800; }

/* ---------- Forms ---------- */
.field { display: block; margin-bottom: 16px; }
.field > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 7px; font-weight: 500; }
.field input, .field textarea, .field select {
  width: 100%;
  background: var(--bg-soft);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  color: var(--text);
  padding: 13px 15px;
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  resize: vertical;
  font-family: inherit;
}
.field textarea { min-height: 84px; }
.field input::placeholder, .field textarea::placeholder { color: #9fbac0; }
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.16);
}

/* ---------- Buttons ---------- */
.btn {
  border: 1.5px solid var(--line-2);
  background: #fff;
  color: var(--text);
  padding: 13px 22px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  transition: transform 0.08s, filter 0.15s, background 0.15s, box-shadow 0.15s;
}
.btn:active { transform: translateY(1px); }
.btn--primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--pink) 100%);
  border-color: transparent; color: #fff;
  box-shadow: 0 14px 26px -12px rgba(2, 132, 199, 0.75);
}
.btn--primary:hover { filter: brightness(1.05); }
.btn--ghost { background: transparent; border-color: var(--line-2); color: var(--text); }
.btn--ghost:hover { background: var(--card-2); }
.btn--gold {
  background: linear-gradient(135deg, var(--pink) 0%, #2dd4bf 100%);
  border-color: transparent; color: #fff;
  box-shadow: 0 14px 26px -12px rgba(13, 148, 136, 0.7);
}
.btn--block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.linkbtn { background: none; border: none; color: var(--muted); font-size: 14px; text-decoration: underline; }
.linkbtn:hover { color: var(--text); }

.auth__hint { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0 0; }

/* ---------- Topbar ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--line);
  background: rgba(246, 252, 251, 0.82);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 10;
  flex-wrap: wrap;
}
.topbar__brand { font-weight: 900; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.topbar__nav { display: flex; gap: 4px; margin-inline-start: auto; flex-wrap: wrap; }
.navbtn {
  background: transparent;
  border: 1.5px solid transparent;
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
}
.navbtn:hover { color: var(--text); background: var(--card-2); }
.navbtn.is-active { color: var(--primary); background: var(--primary-soft); border-color: rgba(2,132,199,0.25); }
.topbar__user { display: flex; align-items: center; gap: 12px; }
.topbar__streak { font-size: 14px; font-weight: 800; color: #d97706; background: #fff3d6; padding: 5px 10px; border-radius: 99px; }
.topbar__name { font-size: 14px; color: var(--muted); font-weight: 600; }

/* ---------- Content ---------- */
.content { max-width: 760px; margin: 0 auto; padding: 30px 20px 90px; }
.view-head { margin-bottom: 24px; }
.view-head h2 { margin: 0 0 5px; font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
.view-head p { margin: 0; color: var(--muted); font-size: 15px; }

/* ---------- Daily Flow ---------- */
.progress { display: flex; gap: 6px; margin-bottom: 26px; }
.progress__dot { flex: 1; height: 7px; border-radius: 99px; background: var(--line); transition: background 0.25s; }
.progress__dot.is-done { background: var(--accent); }
.progress__dot.is-current { background: var(--primary); }

.step__kicker { color: var(--primary); font-weight: 800; font-size: 13px; letter-spacing: 0.4px; }
.step__title { font-size: 23px; font-weight: 800; margin: 6px 0 4px; }
.step__hint { color: var(--muted); margin: 0 0 18px; font-size: 15px; line-height: 1.6; }

.chip-group { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; }
.chip {
  background: var(--bg-soft);
  border: 1.5px solid var(--line);
  color: var(--text);
  padding: 9px 15px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 600;
}
.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip.is-selected { background: linear-gradient(135deg, var(--primary), var(--pink)); border-color: transparent; color: #fff; }

.loop-grid { display: grid; gap: 12px; }
.affirm-card {
  margin: 6px 0 18px;
  padding: 24px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #e0f2fe 0%, #d1fae5 100%);
  border: 1.5px solid var(--line);
  text-align: center;
}
.affirm-card__quote { font-size: 21px; font-weight: 800; line-height: 1.55; color: #0c4a5e; }
.affirm-card__by { color: var(--muted); font-size: 13px; margin-top: 10px; }

.step-actions { display: flex; gap: 10px; margin-top: 24px; }
.step-actions .btn { flex: 1; }

/* ---------- Done state ---------- */
.done { text-align: center; padding: 30px 10px; }
.done__emoji { font-size: 60px; }
.done__title { font-size: 26px; font-weight: 900; margin: 12px 0 6px; }
.done__sub { color: var(--muted); margin: 0 0 22px; }

/* ---------- Pattern Tracker ---------- */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 26px; }
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 18px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat__num {
  font-size: 32px; font-weight: 900;
  background: linear-gradient(120deg, var(--primary), var(--pink));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.stat__label { color: var(--muted); font-size: 13px; margin-top: 4px; font-weight: 500; }

.pattern-list { display: flex; flex-direction: column; gap: 13px; }
.pattern-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 17px 19px;
  box-shadow: var(--shadow-sm);
}
.pattern-item__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; }
.pattern-item__name { font-weight: 800; font-size: 17px; }
.pattern-item__count { color: var(--muted); font-size: 14px; }
.bar { height: 11px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.bar__fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--primary), var(--pink), var(--accent)); transition: width 0.4s; }
.rank { font-size: 20px; margin-inline-end: 6px; }

/* ---------- History ---------- */
.history-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 17px 19px;
  margin-bottom: 13px;
  box-shadow: var(--shadow-sm);
}
.history-item__date { color: var(--muted); font-size: 13px; margin-bottom: 8px; display:flex; justify-content: space-between; font-weight: 500; }
.history-item__pattern { display: inline-block; background: var(--primary-soft); color: var(--primary); border:1px solid rgba(2,132,199,0.2); padding: 4px 12px; border-radius: 99px; font-size: 13px; margin-bottom: 11px; font-weight: 600; }
.history-item__row { margin: 6px 0; font-size: 15px; line-height: 1.55; }
.history-item__row b { color: var(--muted); font-weight: 500; }

/* ---------- Empty / misc ---------- */
.empty { text-align: center; color: var(--muted); padding: 50px 20px; }
.empty__emoji { font-size: 48px; }
.badge-done { color: var(--accent); font-weight: 700; }
.badge-skip { color: var(--muted); }

/* ---------- Weekly summary highlight ---------- */
.summary-hero {
  background: linear-gradient(135deg, #e0f2fe 0%, #ccfbf1 100%);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 26px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-sm);
}
.summary-hero h3 { margin: 0 0 4px; font-size: 15px; color: var(--muted); font-weight: 600; }
.summary-hero .big {
  font-size: 27px; font-weight: 900;
  background: linear-gradient(120deg, var(--primary), var(--pink));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}

/* ---------- Gratitude ---------- */
.grat-hero {
  background: linear-gradient(135deg, var(--pink-soft) 0%, #e0f2fe 100%);
  border: 1.5px solid #bdeae3;
  border-radius: var(--radius);
  padding: 24px 26px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-sm);
}
.grat-hero__title { font-size: 18px; font-weight: 800; margin: 0 0 4px; color: #0f766e; }
.grat-hero__sub { margin: 0; color: #0d9488; font-size: 14px; }
.grat-fields { display: grid; gap: 12px; }
.grat-input-wrap { position: relative; }
.grat-input-wrap::before {
  content: attr(data-num);
  position: absolute;
  inset-inline-start: 14px;
  top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px;
  display: grid; place-items: center;
  background: var(--pink-soft); color: #0f766e;
  border-radius: 50%; font-size: 13px; font-weight: 800;
  pointer-events: none;
}
.grat-input-wrap input { padding-inline-start: 50px; }
.grat-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.grat-note {
  background: linear-gradient(160deg, #f0fdfb 0%, #ccfbf1 100%);
  border: 1px solid #bdeae3;
  border-radius: var(--radius-sm);
  padding: 15px 16px;
  box-shadow: var(--shadow-sm);
  position: relative;
}
.grat-note__text { font-size: 15px; line-height: 1.5; font-weight: 600; color: #115e59; }
.grat-note__date { color: #5fa39a; font-size: 12px; margin-top: 9px; }
.grat-note__pin { position: absolute; top: -8px; inset-inline-end: 14px; font-size: 16px; }
.grat-today-list { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 4px; }
.grat-today-item { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.5; }
.grat-today-item .dot { color: var(--pink); font-size: 18px; line-height: 1.4; }

/* ---------- Bell button ---------- */
.bellbtn {
  position: relative;
  background: var(--card-2);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  font-size: 16px;
  line-height: 1;
  padding: 7px 10px;
}
.bellbtn:hover { background: var(--primary-soft); border-color: rgba(2,132,199,0.3); }
.bellbtn__dot {
  position: absolute; top: -3px; inset-inline-end: -3px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--pink); border: 2px solid var(--bg);
}

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(8, 30, 38, 0.46);
  backdrop-filter: blur(3px);
  display: grid; place-items: center;
  padding: 20px; z-index: 60;
  opacity: 0; transition: opacity 0.18s;
}
.modal-overlay.is-show { opacity: 1; }
.modal {
  position: relative;
  width: 100%; max-width: 420px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: 0 30px 60px -20px rgba(2, 132, 199, 0.5);
  transform: translateY(10px) scale(0.98);
  transition: transform 0.18s;
}
.modal-overlay.is-show .modal { transform: translateY(0) scale(1); }
.modal__close {
  position: absolute; top: 14px; inset-inline-start: 14px;
  background: transparent; border: none; font-size: 18px; color: var(--muted);
}
.modal__close:hover { color: var(--text); }
.modal__icon {
  width: 66px; height: 66px; margin: 0 auto 14px;
  display: grid; place-items: center; font-size: 30px;
  background: linear-gradient(140deg, var(--primary), var(--pink));
  border-radius: 20px;
  box-shadow: 0 14px 24px -12px rgba(2,132,199,0.6);
}
.modal__title { text-align: center; margin: 0 0 6px; font-size: 23px; font-weight: 900; }
.modal__sub { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 15px; line-height: 1.6; }
.modal__note { text-align: center; font-size: 14px; color: var(--primary); font-weight: 600; min-height: 18px; margin: 8px 0 0; }
.modal__fineprint { text-align: center; font-size: 12px; color: var(--muted); margin: 16px 0 0; line-height: 1.5; }

.switch-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; margin-bottom: 16px;
  background: var(--bg-soft); border: 1.5px solid var(--line); border-radius: 14px;
  font-weight: 600;
}
.switch { position: relative; display: inline-block; width: 50px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch__track {
  position: absolute; inset: 0; cursor: pointer;
  background: var(--line-2); border-radius: 99px; transition: background 0.2s;
}
.switch__track::before {
  content: ""; position: absolute; height: 22px; width: 22px;
  inset-inline-start: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: transform 0.2s;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.switch input:checked + .switch__track { background: linear-gradient(135deg, var(--primary), var(--pink)); }
.switch input:checked + .switch__track::before { transform: translateX(-22px); }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  bottom: 24px;
  inset-inline-start: 50%;
  transform: translateX(50%) translateY(20px);
  background: var(--text);
  border: none;
  color: #fff;
  padding: 13px 22px;
  border-radius: 14px;
  box-shadow: var(--shadow);
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 50;
}
.toast.is-show { opacity: 1; transform: translateX(50%) translateY(0); }

/* ===================== Visual polish & motion ===================== */

/* Floating decorative blobs behind everything */
body::before, body::after {
  content: "";
  position: fixed;
  z-index: -1;
  border-radius: 50%;
  filter: blur(64px);
  opacity: 0.55;
  pointer-events: none;
}
body::before {
  width: 340px; height: 340px;
  top: -90px; inset-inline-start: -100px;
  background: radial-gradient(circle, #a9e0ff, transparent 70%);
  animation: floatA 16s ease-in-out infinite;
}
body::after {
  width: 380px; height: 380px;
  bottom: -130px; inset-inline-end: -130px;
  background: radial-gradient(circle, #a7f3d0, transparent 70%);
  animation: floatB 20s ease-in-out infinite;
}
@keyframes floatA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,40px)} }
@keyframes floatB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,-30px)} }

/* Gradient text on big titles */
.brand__name, .view-head h2 {
  background: linear-gradient(120deg, var(--primary) 0%, var(--pink) 55%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}

/* Login hero mascot */
.hero { width: 200px; margin: 0 auto 6px; }
.hero svg { width: 100%; height: auto; overflow: visible; }
.hero__orbit { transform-origin: 120px 112px; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hero__spark { transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
.hero__spark--2 { animation-delay: 0.7s; }
.hero__spark--3 { animation-delay: 1.3s; }
@keyframes twinkle { 0%,100%{opacity:.25;transform:scale(.7)} 50%{opacity:1;transform:scale(1.15)} }

/* Entrance animation for view content (staggered) */
.content > * { animation: fadeInUp 0.5s cubic-bezier(0.2,0.7,0.3,1) both; }
.content > *:nth-child(2){animation-delay:.05s}
.content > *:nth-child(3){animation-delay:.10s}
.content > *:nth-child(4){animation-delay:.15s}
.content > *:nth-child(5){animation-delay:.20s}
.content > *:nth-child(n+6){animation-delay:.25s}
@keyframes fadeInUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
.card, .auth { animation: fadeInUp 0.5s cubic-bezier(0.2,0.7,0.3,1) both; }

/* Nav icons */
.navbtn { display: inline-flex; align-items: center; gap: 7px; }
.navbtn svg { width: 17px; height: 17px; flex: none; }

/* Interactive hover lift on cards */
.stat, .pattern-item, .history-item, .grat-note {
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.stat:hover, .pattern-item:hover, .history-item:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 34px -16px rgba(2, 132, 199, 0.40);
}
.grat-note:hover { transform: translateY(-3px) rotate(-1deg); }
.grat-note:nth-child(even):hover { transform: translateY(-3px) rotate(1deg); }

/* Chip pop on select */
.chip { transition: transform 0.12s ease, background 0.15s, border-color 0.15s, color 0.15s; }
.chip:active { transform: scale(0.94); }
.chip.is-selected { animation: pop 0.2s ease; }
@keyframes pop { 0%{transform:scale(.9)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }

/* Step badge (big friendly emoji per step) */
.step__badge {
  width: 64px; height: 64px; margin-bottom: 14px;
  display: grid; place-items: center; font-size: 32px;
  background: linear-gradient(140deg, var(--primary-soft), var(--accent-soft));
  border: 1.5px solid var(--line);
  border-radius: 20px;
  animation: pop 0.4s ease both;
}

/* Friendly empty-state */
.empty__emoji { display: inline-block; animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

/* Affirm card shimmer accent */
.affirm-card { position: relative; overflow: hidden; }
.affirm-card::after {
  content: ""; position: absolute; top: 0; inset-inline-start: -60%;
  width: 40%; height: 100%;
  background: linear-gradient(110deg, transparent, rgba(255,255,255,.6), transparent);
  transform: skewX(-18deg);
  animation: sweep 4.5s ease-in-out infinite;
}
@keyframes sweep { 0%,60%{inset-inline-start:-60%} 100%{inset-inline-start:130%} }

/* Buttons get a gentle hover lift */
.btn--primary, .btn--gold { transition: transform 0.1s, filter 0.15s, box-shadow 0.15s; }
.btn--primary:hover, .btn--gold:hover { transform: translateY(-1px); }

/* Respect reduced-motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (max-width: 560px) {
  .stat-row { grid-template-columns: 1fr; }
  .topbar__nav { order: 3; width: 100%; justify-content: space-between; }
  .navbtn span { display: none; }          /* icons-only nav on small screens */
  .navbtn { padding: 9px 12px; }
  .navbtn svg { width: 19px; height: 19px; }
}

/* ===================== North-star identity + challenge ===================== */
.northstar {
  width: 100%; display: flex; align-items: center; gap: 10px;
  background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft));
  border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 16px; margin-bottom: 16px; text-align: start;
  cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.northstar:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.northstar__star { font-size: 20px; flex: none; }
.northstar__text { display: flex; flex-direction: column; line-height: 1.25; flex: 1; }
.northstar__label { font-size: 12px; color: var(--muted); }
.northstar__val { font-weight: 800; color: var(--primary); }
.northstar__edit { color: var(--muted); font-size: 15px; flex: none; }
.northstar--empty { color: var(--muted); font-weight: 600; justify-content: center; }

.challenge {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.challenge--suggest {
  background: linear-gradient(135deg, #fff3d6 0%, var(--accent-soft) 100%);
  border-color: #f3e2bf;
}
.challenge__head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.challenge__badge { font-weight: 800; font-size: 13px; color: var(--primary); background: var(--primary-soft); padding: 5px 12px; border-radius: 99px; }
.challenge__badge--alert { color: #b45309; background: #fff3d6; }
.challenge__pattern { font-weight: 700; }
.challenge__msg { margin: 10px 0 4px; font-size: 15px; line-height: 1.6; }
.challenge__tasks { display: flex; flex-direction: column; gap: 8px; }
.challenge__task {
  display: flex; align-items: center; gap: 12px; text-align: start;
  background: var(--bg-soft); border: 1.5px solid var(--line);
  border-radius: 12px; padding: 11px 14px; font-size: 15px; font-weight: 600;
  color: var(--text); transition: border-color .15s, background .15s, color .15s;
}
.challenge__task:hover { border-color: var(--primary); }
.challenge__task.is-done { background: var(--accent-soft); border-color: transparent; color: var(--muted); }
.challenge__task.is-done .challenge__tasktext { text-decoration: line-through; }
.challenge__check {
  width: 26px; height: 26px; flex: none; display: grid; place-items: center;
  border-radius: 50%; background: #fff; border: 1.5px solid var(--line-2);
  font-weight: 800; font-size: 13px; color: var(--muted);
}
.challenge__task.is-done .challenge__check { background: var(--accent); border-color: transparent; color: #fff; }
.challenge__tasktext { flex: 1; }
.challenge__foot { margin-top: 12px; font-size: 13px; color: var(--muted); font-weight: 600; }

/* ===================== Celebration (task complete) ===================== */
.celebrate {
  position: fixed; inset: 0; z-index: 80;
  display: grid; place-items: center;
  background: rgba(15, 42, 51, 0.18);
  backdrop-filter: blur(2px);
  pointer-events: none;
  transition: opacity 0.4s;
}
.celebrate.is-out { opacity: 0; }
.celebrate__card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 30px 40px;
  box-shadow: var(--shadow);
  text-align: center;
  pointer-events: auto;
  animation: celebPop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
}
.celebrate__emoji { font-size: 66px; animation: celebBounce 1s ease-in-out infinite; }
.celebrate__title {
  font-size: 24px; font-weight: 900; margin-top: 10px;
  background: linear-gradient(120deg, var(--primary), var(--pink), var(--accent));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.celebrate__sub { color: var(--muted); margin-top: 6px; font-size: 15px; }
@keyframes celebPop { from { opacity: 0; transform: scale(0.6) translateY(12px); } to { opacity: 1; transform: scale(1); } }
@keyframes celebBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.confetti {
  position: fixed; top: -24px; width: 10px; height: 14px; z-index: 79;
  will-change: transform; pointer-events: none;
  animation-name: confettiFall; animation-timing-function: linear; animation-fill-mode: forwards;
}
@keyframes confettiFall { to { transform: translateY(112vh) rotate(720deg); } }

/* ---------- Calendar sync (reminder modal) ---------- */
.cal-sync { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line-2); }
.cal-sync__title { font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; margin-bottom: 12px; line-height: 1.5; }

/* ---------- "Come back tomorrow" banner (done screen) ---------- */
.comeback {
  display: inline-block;
  margin: 14px auto 4px;
  background: var(--accent-soft);
  color: #0f766e;
  font-weight: 800;
  font-size: 15px;
  padding: 10px 20px;
  border-radius: 99px;
}

/* ---------- Version label ---------- */
.ver { font-size: 11px; font-weight: 700; color: var(--muted); opacity: 0.8; }

/* ===================== Daily Mantra ===================== */
.mantra-focus-wrap { text-align: center; margin-bottom: 16px; }
.mantra-focus {
  display: inline-block;
  background: var(--primary-soft); color: var(--primary);
  border: 1px solid rgba(2,132,199,0.2);
  font-weight: 700; font-size: 14px;
  padding: 8px 16px; border-radius: 99px;
}
.mantra-card {
  background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft));
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 34px 24px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.3s, transform 0.2s;
}
.mantra-card__quote { font-size: 25px; font-weight: 900; line-height: 1.5; color: #0c4a5e; }
.mantra-orbs { display: flex; justify-content: center; gap: 12px; margin-top: 24px; }
.orb {
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff; border: 2px solid var(--line-2);
  transition: transform 0.2s ease, background 0.2s, border-color 0.2s;
}
.orb.is-on {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-color: transparent; transform: scale(1.15);
  box-shadow: 0 4px 10px -3px rgba(2,132,199,0.5);
}
.mantra-card.is-complete {
  box-shadow: 0 0 0 4px rgba(16,185,129,0.25), var(--shadow);
  animation: mantraPulse 1.3s ease-in-out infinite;
}
.mantra-card.is-complete .orb {
  background: linear-gradient(135deg, var(--accent), var(--gold));
}
@keyframes mantraPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.015); } }
.mantra-say { margin-top: 20px; font-size: 18px; padding: 16px; }
.mantra-say b { font-weight: 900; }
.mantra-done { text-align: center; margin-top: 20px; }
.mantra-done__title {
  font-size: 21px; font-weight: 900;

}
.mantra-done__sub { color: var(--muted); margin: 6px 0 16px; font-size: 15px; }

/* mantra custom-edit link */

  color: var(--muted); font-weight: 600; font-size: 13px; text-decoration: underline;
}
.mantra-edit:hover { color: var(--primary); }

  // מיקרו-אתגרים בני 3 ימים לשבירת דפוס חוזר (ניסוח אינפיניטיבי ניטרלי)
  const CHALLENGE_TASKS = {
    "השוואה לאחרים": [

    ],
    "דחיית שיחות מכירה": [

    "פחד מתמחור": [
      "לשלוח הצעה במחיר מלא, בלי הנחה",

    ],
    "פרפקציוניזם": [

    ],
    "ספק עצמי": [
      "לכתוב 3 הצלחות מהשבוע האחרון",
      "לעשות דבר אחד שמפחיד קצת",

  const CHALLENGE_DEFAULT = [
    "לזהות את הרגע שבו הדפוס מופיע — ולעצור",

  const challengeTasksFor = (pattern) => CHALLENGE_TASKS[pattern] || CHALLENGE_DEFAULT;

  // מנטרות יומיות — מותאמות למיקוד (דפוס), מותאמות מגדר
  const MANTRAS = {
    "השוואה לאחרים": { f: "אני נשארת במסלול שלי. ההשוואה לא שייכת לי.", m: "אני נשאר במסלול שלי. ההשוואה לא שייכת לי.", n: "להישאר במסלול שלי. ההשוואה לא שייכת לי." },
    "דחיינות": { f: "אני מתחילה עכשיו — צעד אחד קטן מספיק.", m: "אני מתחיל עכשיו — צעד אחד קטן מספיק.", n: "להתחיל עכשיו — צעד אחד קטן מספיק." },
    "פחד מתמחור": { f: "המחיר שלי משקף את הערך שאני נותנת.", m: "המחיר שלי משקף את הערך שאני נותן.", n: "המחיר משקף את הערך שאני נותן/ת." },
    "דחיית שיחות מכירה": { f: "אני יוזמת בביטחון. יש לי מה לתת.", m: "אני יוזם בביטחון. יש לי מה לתת.", n: "ליזום בביטחון. יש לי מה לתת." },
    "ספק עצמי": { f: "אני סומכת על עצמי, גם בלי ודאות.", m: "אני סומך על עצמי, גם בלי ודאות.", n: "לסמוך על עצמי, גם בלי ודאות." },
    "פרפקציוניזם": { f: "מספיק טוב זה מצוין. אני משחררת ומתקדמת.", m: "מספיק טוב זה מצוין. אני משחרר ומתקדם.", n: "מספיק טוב זה מצוין. לשחרר ולהתקדם." },
    "פחד מדחייה": { f: "'לא' לא מגדיר אותי. אני ממשיכה לבקש.", m: "'לא' לא מגדיר אותי. אני ממשיך לבקש.", n: "'לא' לא מגדיר אותי. להמשיך לבקש." },
    "תסמונת המתחזה": { f: "אני שייכת לכאן. ההישגים שלי אמיתיים.", m: "אני שייך לכאן. ההישגים שלי אמיתיים.", n: "אני שייך/ת לכאן. ההישגים אמיתיים." },
    "התפזרות / חוסר פוקוס": { f: "דבר אחד בכל פעם. אני בוחרת מיקוד.", m: "דבר אחד בכל פעם. אני בוחר מיקוד.", n: "דבר אחד בכל פעם. לבחור מיקוד." },
    "פחד מחשיפה": { f: "אני מרשה לעצמי להיראות. הקול שלי חשוב.", m: "אני מרשה לעצמי להיראות. הקול שלי חשוב.", n: "להרשות לעצמי להיראות. הקול שלי חשוב." },
  };

  /* ----------------------- Gender-aware text ---------------------------- */
  // מגדר נוכחי: 'f' נקבה · 'm' זכר · 'n' ניטרלי
  const G = () => (state.user && state.user.gender) || "f";
  // בחירת מחרוזת לפי מגדר; חוסר ערך נופל לניטרלי ואז לנקבה
  const gx = (variants) => variants[G()] || variants.n || variants.f;
  const affirmations = () => AFFIRMATIONS[G()] || AFFIRMATIONS.f;
  const gratPrompts = () => GRAT_PROMPTS[G()] || GRAT_PROMPTS.f;
  const randAffirmation = () => {
    const a = affirmations();
    return a[Math.floor(Math.random() * a.length)];
  };

  /* ----------------------------- Utilities ----------------------------- */

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const tpl = (id) => $(`#${id}`).content.cloneNode(true);

  const todayKey = (d = new Date()) => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };

  const fmtDate = (key) => {
    const [y, m, d] = key.split("-");
    return new Date(y, m - 1, d).toLocaleDateString("he-IL", {
      weekday: "long", day: "numeric", month: "long",
    });
  };

  const daysBetween = (a, b) =>
    Math.round((new Date(a) - new Date(b)) / 86400000);

  let _toastTimer;
  const toast = (msg) => {
    let el = $(".toast");
    if (!el) {
      el = document.createElement("div");
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    requestAnimationFrame(() => el.classList.add("is-show"));
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove("is-show"), 2200);
  };

  const esc = (s = "") =>
    String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));

  const reducedMotion = () =>
    window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // חגיגה כיפית ומעודדת בסיום משימה — קונפטי + כרטיס עידוד
  function celebrate({ emoji = "🎉", title = "כל הכבוד!", sub = "" } = {}) {
    const overlay = document.createElement("div");
    overlay.className = "celebrate";
    overlay.innerHTML = `
      <div class="celebrate__card">
        <div class="celebrate__emoji">${emoji}</div>
        <div class="celebrate__title">${esc(title)}</div>
        ${sub ? `<div class="celebrate__sub">${esc(sub)}</div>` : ""}
      </div>`;
    document.body.appendChild(overlay);

    if (!reducedMotion()) {
      const colors = ["#0284c7", "#0ea5e9", "#10b981", "#14b8a6", "#22d3ee", "#34d399", "#f7b32b"];
      for (let i = 0; i < 90; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.insetInlineStart = Math.random() * 100 + "vw";
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = (1.6 + Math.random() * 1.5) + "s";
        c.style.animationDelay = (Math.random() * 0.4) + "s";
        c.style.transform = "rotate(" + Math.random() * 360 + "deg)";
        if (Math.random() < 0.5) c.style.borderRadius = "50%";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3600);
      }
    }
    const done = () => { overlay.classList.add("is-out"); setTimeout(() => overlay.remove(), 400); };
    overlay.addEventListener("click", done);
    setTimeout(done, 2600);
  }

  /* ------------------------------ Storage ------------------------------ */

  const Store = {
    getSession: () => localStorage.getItem(LS_SESSION),
    setSession: (email) => localStorage.setItem(LS_SESSION, email),
    clearSession: () => localStorage.removeItem(LS_SESSION),

    loadUser(email) {
      const raw = localStorage.getItem(userKey(email));
      if (raw) {
        try {
          const u = JSON.parse(raw);
          if (!Array.isArray(u.entries)) u.entries = [];
          if (!Array.isArray(u.gratitude)) u.gratitude = [];
          if (!Array.isArray(u.challenges)) u.challenges = [];
          if (!Array.isArray(u.mantras)) u.mantras = [];
          if (typeof u.customMantra !== "string") u.customMantra = "";
          if (!u.reminder) u.reminder = { enabled: false, time: "20:00" };
          if (!u.gender) u.gender = "f";
          if (typeof u.identity !== "string") u.identity = "";
          if (typeof u.onboardDone !== "boolean") u.onboardDone = true; // משתמשים קיימים
          return u;
        } catch (_) { /* fallthrough */ }
      }
      return {
        email, name: "", createdAt: todayKey(), gender: "f",
        identity: "", onboardDone: false, customMantra: "",
        entries: [], gratitude: [], challenges: [], mantras: [],
        reminder: { enabled: false, time: "20:00" },
      };
    },

    saveUser(user) {
      localStorage.setItem(userKey(user.email), JSON.stringify(user));
    },
  };

  /* --------------------------- App State ------------------------------- */

  const state = {
    user: null,
    view: "daily",
    draft: null,   // טיוטת התרגול היומי הנוכחי
    step: 0,
  };

  /* --------------------------- Domain logic ---------------------------- */

  const getEntry = (dateKey) =>
    state.user.entries.find((e) => e.date === dateKey) || null;

  const blankDraft = () => ({
    date: todayKey(),
    pattern: "",
    trigger: "",
    thought: "",
    oldAction: "",
    identityAction: "",
    oneAction: "",
    affirmation: randAffirmation(),
    completed: false,
    actionDone: false,
    createdAt: new Date().toISOString(),
  });

  function saveEntry(entry) {
    const idx = state.user.entries.findIndex((e) => e.date === entry.date);
    if (idx >= 0) state.user.entries[idx] = entry;
    else state.user.entries.push(entry);
    state.user.entries.sort((a, b) => (a.date < b.date ? 1 : -1));
    Store.saveUser(state.user);
  }

  // חישוב streak — ימים רצופים עם תרגול שהושלם
  function computeStreak() {
    const done = new Set(
      state.user.entries.filter((e) => e.completed).map((e) => e.date)
    );
    let streak = 0;
    let cursor = new Date();
    // אם היום עדיין לא בוצע — מתחילים לספור מאתמול
    if (!done.has(todayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
    while (done.has(todayKey(cursor))) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  // ניסוח רצף בעברית תקינה (יום אחד / N ימים)
  const streakText = (n) => (n === 1 ? "יום אחד רצוף" : `${n} ימים רצופים`);

  // Pattern Tracker — ספירת דפוסים בחלון זמן (ברירת מחדל: 7 ימים)
  function patternStats(days = 7) {
    const since = todayKey(new Date(Date.now() - (days - 1) * 86400000));
    const counts = {};
    state.user.entries
      .filter((e) => e.completed && e.pattern && e.date >= since)
      .forEach((e) => { counts[e.pattern] = (counts[e.pattern] || 0) + 1; });
    return Object.entries(counts)
      .map(([name, count]) => ({ name, count }))
      .sort((a, b) => b.count - a.count);
  }

  function weeklySummary() {
    const since = todayKey(new Date(Date.now() - 6 * 86400000));
    const week = state.user.entries.filter((e) => e.date >= since);
    const completed = week.filter((e) => e.completed);
    const actionsDone = completed.filter((e) => e.actionDone);
    const stats = patternStats(7);
    const top = stats[0] || null;
    return {
      practiced: completed.length,
      actionsDone: actionsDone.length,
      topPattern: top,
      lastAction: completed[0] ? completed[0].oneAction : "",
      allStats: stats,
    };
  }

  /* ----- Gratitude ----- */
  const getGratitude = (dateKey) =>
    state.user.gratitude.find((g) => g.date === dateKey) || null;

  function saveGratitude(items) {
    const clean = items.map((s) => s.trim()).filter(Boolean);
    const date = todayKey();
    const idx = state.user.gratitude.findIndex((g) => g.date === date);
    if (clean.length === 0) {
      if (idx >= 0) state.user.gratitude.splice(idx, 1);
    } else {
      const rec = { date, items: clean, createdAt: new Date().toISOString() };
      if (idx >= 0) state.user.gratitude[idx] = rec;
      else state.user.gratitude.push(rec);
    }
    state.user.gratitude.sort((a, b) => (a.date < b.date ? 1 : -1));
    Store.saveUser(state.user);
  }

  function gratitudeStreak() {
    const done = new Set(state.user.gratitude.map((g) => g.date));
    let streak = 0;
    let cursor = new Date();
    if (!done.has(todayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
    while (done.has(todayKey(cursor))) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  const gratitudeTotal = () =>
    state.user.gratitude.reduce((s, g) => s + g.items.length, 0);

  /* ----------------------- Micro-challenges ---------------------------- */

  const activeChallenge = () =>
    state.user.challenges.find((c) => c.status === "active") || null;

  // דפוס שחזר 3+ פעמים (3 שבועות אחרונים) וטרם טופל באתגר
  function suggestedChallengePattern() {
    if (activeChallenge()) return null; // אתגר אחד בכל פעם
    const handled = new Set(
      state.user.challenges
        .filter((c) => c.status === "active" || c.status === "done")
        .map((c) => c.pattern)
    );
    const dismissedToday = new Set(
      state.user.challenges
        .filter((c) => c.status === "dismissed" && c.dismissedOn === todayKey())
        .map((c) => c.pattern)
    );
    const top = patternStats(21).find(
      (p) => p.count >= 3 && !handled.has(p.name) && !dismissedToday.has(p.name)
    );
    return top ? top.name : null;
  }

  function startChallenge(pattern) {
    state.user.challenges.push({
      id: "c" + Date.now(),
      pattern,
      tasks: challengeTasksFor(pattern),
      done: [false, false, false],
      status: "active",
      startedOn: todayKey(),
    });
    Store.saveUser(state.user);
  }

  function toggleChallengeDay(ch, i) {
    ch.done[i] = !ch.done[i];
    if (ch.done.every(Boolean)) {
      ch.status = "done";
      ch.completedOn = todayKey();
    } else if (ch.status === "done") {
      ch.status = "active";
      delete ch.completedOn;
    }
    Store.saveUser(state.user);
  }

  function dismissChallenge(pattern) {
    state.user.challenges.push({
      id: "c" + Date.now(), pattern, status: "dismissed", dismissedOn: todayKey(),
    });
    Store.saveUser(state.user);
  }

  const challengesDone = () =>
    state.user.challenges.filter((c) => c.status === "done").length;

  /* ----------------------- Daily Mantra ------------------------------- */

  // המיקוד הנוכחי: הדפוס החזק → אחרת הזהות → אחרת חיזוק כללי
  function currentFocus() {
    const top = patternStats(7)[0] || patternStats(3650)[0];
    if (top && MANTRAS[top.name]) return { type: "pattern", label: top.name };
    if (state.user.identity) return { type: "identity", label: state.user.identity };
    return { type: "default", label: "" };
  }

  // המנטרה + תווית המיקוד (יציב לאורך היום)
  function currentMantra() {
    const f = currentFocus();
    if (f.type === "pattern")
      return { text: gx(MANTRAS[f.label]), focus: `הדפוס שמנהל אותך: ${f.label}` };
    if (f.type === "identity")
      return { text: gx({ f: `אני «${f.label}». זאת אני.`, m: `אני «${f.label}». זה אני.`, n: `«${f.label}» — זאת הזהות שלי.` }), focus: "הזהות שלך" };
    const arr = affirmations();
    return { text: arr[new Date().getDate() % arr.length], focus: "חיזוק כללי" };
  }

  // המנטרה הפעילה — מנטרה אישית אם הוגדרה, אחרת המומלצת לפי המיקוד
  function activeMantra() {
    const c = (state.user.customMantra || "").trim();
    if (c) return { text: c, focus: "המנטרה שלך", custom: true };
    return { ...currentMantra(), custom: false };
  }

  function setCustomMantra(text) {
    state.user.customMantra = (text || "").trim();
    Store.saveUser(state.user);
    // עדכון מיידי של היום: מנטרה חדשה → סבב מתחיל מחדש
    const rec = getMantraRec(todayKey());
    if (rec) {
      const am = activeMantra();
      rec.mantra = am.text; rec.focus = am.focus; rec.count = 0;
      Store.saveUser(state.user);
    }
  }

  const getMantraRec = (date) =>
    state.user.mantras.find((m) => m.date === date) || null;

  // לחיצה אחת — מסמנת אמירה נוספת (עד 5 לסבב)
  function tapMantra() {
    const date = todayKey();
    let rec = getMantraRec(date);
    if (!rec) {
      const cm = activeMantra();
      rec = { date, mantra: cm.text, focus: cm.focus, count: 0, taps: 0, done: false };
      state.user.mantras.push(rec);
    }
    if (rec.count < 5) { rec.count++; rec.taps++; }
    if (rec.count >= 5) rec.done = true;
    state.user.mantras.sort((a, b) => (a.date < b.date ? 1 : -1));
    Store.saveUser(state.user);
    return rec;
  }

  // סבב נוסף — מאפס את הספירה (היום נשאר "הושלם")
  function resetMantraRound() {
    const rec = getMantraRec(todayKey());
    if (rec) { rec.count = 0; Store.saveUser(state.user); }
  }

  function mantraStreak() {
    const done = new Set(state.user.mantras.filter((m) => m.done).map((m) => m.date));
    let streak = 0, cursor = new Date();
    if (!done.has(todayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
    while (done.has(todayKey(cursor))) { streak++; cursor.setDate(cursor.getDate() - 1); }
    return streak;
  }

  const mantraTotal = () =>
    state.user.mantras.reduce((s, m) => s + (m.taps || 0), 0);

  /* ---------------------------- Reminders ------------------------------ */

  let reminderTimer = null;
  let lastNudgeDate = null;

  const notifSupported = () => "Notification" in window;

  // הצגת התראה — מעדיף את ה-Service Worker (אמין במובייל), אחרת Notification, אחרת toast
  function showNotify(title, body) {
    if (notifSupported() && Notification.permission === "granted") {
      if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready
          .then((reg) => reg.active && reg.active.postMessage({ type: "show-reminder", title, body }))
          .catch(() => { try { new Notification(title, { body }); } catch (_) { toast(body); } });
        return;
      }
      try { new Notification(title, { body, tag: "mlos-daily" }); return; }
      catch (_) { /* fall through */ }
    }
    toast(body);
  }

  function msUntilNext(timeStr) {
    const [h, m] = timeStr.split(":").map(Number);
    const now = new Date();
    const next = new Date();
    next.setHours(h, m, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1); // היום כבר עבר → מחר
    return next - now;
  }

  function fireReminder() {
    // לא להציק אם כבר השלימה את האימון היום
    const doneToday = !!(getEntry(todayKey()) || {}).completed;
    if (doneToday) { scheduleReminder(); return; }
    if (lastNudgeDate === todayKey()) { scheduleReminder(); return; }
    lastNudgeDate = todayKey();

    const body = `${state.user.name ? state.user.name + ", " : ""}5 דקות לגרסה הבאה שלך. בואי נעשה Daily Reset 🔁`;
    showNotify("Mind Loops", body);
    scheduleReminder();
  }

  function scheduleReminder() {
    if (reminderTimer) { clearTimeout(reminderTimer); reminderTimer = null; }
    const r = state.user && state.user.reminder;
    if (!r || !r.enabled) return;
    // setTimeout מוגבל ל-~24.8 ימים — מספיק טוב לתזכורת יומית
    reminderTimer = setTimeout(fireReminder, msUntilNext(r.time));
  }

  /* ----- Calendar sync (always-on reminders, no backend) ----- */
  const pad2 = (n) => String(n).padStart(2, "0");

  // טווח האירוע (5 דק') מתוך שעת התזכורת — זמן מקומי "צף"
  function calRange(time) {
    const [h, m] = (time || "20:00").split(":").map(Number);
    const s = new Date(); s.setHours(h, m, 0, 0);
    const e = new Date(s.getTime() + 5 * 60000);
    const fmt = (d) =>
      `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
    return { start: fmt(s), end: fmt(e) };
  }

  const CAL_TITLE = "Mind Loops — אימון יומי 🔁";
  const CAL_DETAILS = "5 דקות לגרסה הבאה שלך. פִתחו את Mind Loops ועשו Daily Reset.";

  function googleCalUrl(time) {
    const { start, end } = calRange(time);
    const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "UTC";
    const q = new URLSearchParams({
      action: "TEMPLATE",
      text: CAL_TITLE,
      details: CAL_DETAILS,
      dates: `${start}/${end}`,
      ctz: tz,
      recur: "RRULE:FREQ=DAILY",
    });
    return "https://calendar.google.com/calendar/render?" + q.toString();
  }

  function downloadICS(time) {
    const { start, end } = calRange(time);
    const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    const ics = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Mind Loops//HE//", "CALSCALE:GREGORIAN",
      "BEGIN:VEVENT",
      `UID:mlos-${Date.now()}@mindloops`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${start}`,
      `DTEND:${end}`,
      "RRULE:FREQ=DAILY",
      `SUMMARY:${CAL_TITLE}`,
      `DESCRIPTION:${CAL_DETAILS}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Mind Loops", "TRIGGER:PT0M", "END:VALARM",
      "END:VEVENT", "END:VCALENDAR",
    ].join("\r\n");
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "mind-loops-reminder.ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function ensureNotifyPermission() {
    if (!notifSupported()) return false;
    if (Notification.permission === "granted") return true;
    if (Notification.permission === "denied") return false;
    try { return (await Notification.requestPermission()) === "granted"; }
    catch (_) { return false; }
  }

  function openReminderModal() {
    if ($(".modal-overlay")) return;
    const node = tpl("tpl-reminder");
    document.body.appendChild(node);
    const overlay = $(".modal-overlay");
    requestAnimationFrame(() => overlay.classList.add("is-show"));

    const r = state.user.reminder;
    const enabledEl = $("[data-rem-enabled]", overlay);
    const timeEl = $("[data-rem-time]", overlay);
    const statusEl = $("[data-rem-status]", overlay);
    enabledEl.checked = !!r.enabled;
    timeEl.value = r.time || "20:00";

    const refreshStatus = () => {
      if (!notifSupported()) {
        statusEl.textContent = "הדפדפן לא תומך בהתראות — נשתמש בתזכורת בתוך האפליקציה.";
      } else if (Notification.permission === "denied") {
        statusEl.textContent = "התראות חסומות בדפדפן — נציג תזכורת בתוך האפליקציה.";
      } else if (enabledEl.checked && r.enabled) {
        statusEl.textContent = `התזכורת פעילה ל-${r.time} בכל יום ✓`;
      } else {
        statusEl.textContent = "";
      }
    };
    refreshStatus();

    const close = () => {
      overlay.classList.remove("is-show");
      setTimeout(() => overlay.remove(), 180);
    };
    $("[data-close]", overlay).addEventListener("click", close);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

    $("[data-rem-test]", overlay).addEventListener("click", async () => {
      await ensureNotifyPermission();
      const body = `${state.user.name ? state.user.name + ", " : ""}5 דקות לגרסה הבאה שלך 🔁`;
      showNotify("Mind Loops", body);
    });

    $("[data-rem-save]", overlay).addEventListener("click", async () => {
      const enabled = enabledEl.checked;
      if (enabled) await ensureNotifyPermission();
      state.user.reminder = { enabled, time: timeEl.value || "20:00" };
      Store.saveUser(state.user);
      scheduleReminder();
      updateBell();
      toast(enabled ? `תזכורת נקבעה ל-${state.user.reminder.time} ⏰` : "התזכורת בוטלה");
      close();
    });

    $("[data-cal-google]", overlay).addEventListener("click", () => {
      window.open(googleCalUrl(timeEl.value || "20:00"), "_blank", "noopener");
      toast("נפתח אירוע יומי ב-Google Calendar 📅");
    });
    $("[data-cal-ics]", overlay).addEventListener("click", () => {
      downloadICS(timeEl.value || "20:00");
      toast("הורד קובץ יומן — פתחי אותו כדי להוסיף אירוע יומי 📅");
    });
  }

  function challengeCardHtml() {
    const ch = activeChallenge();
    if (ch) {
      const doneN = ch.done.filter(Boolean).length;
      return `<div class="challenge">
        <div class="challenge__head">
          <span class="challenge__badge">🎯 אתגר 3 ימים</span>
          <span class="challenge__pattern">${esc(ch.pattern)}</span>
        </div>
        <div class="challenge__tasks">
          ${ch.tasks.map((t, i) => `
            <button type="button" class="challenge__task ${ch.done[i] ? "is-done" : ""}" data-ch-day="${i}">
              <span class="challenge__check">${ch.done[i] ? "✓" : i + 1}</span>
              <span class="challenge__tasktext">${esc(t)}</span>
            </button>`).join("")}
        </div>
        <div class="challenge__foot">${doneN}/3 הושלמו${doneN === 3 ? " — כל הכבוד! 🎉" : ""}</div>
      </div>`;
    }
    const sp = suggestedChallengePattern();
    if (sp) {
      return `<div class="challenge challenge--suggest" data-suggest="${esc(sp)}">
        <span class="challenge__badge challenge__badge--alert">⚡ דפוס חוזר</span>
        <p class="challenge__msg">הדפוס «${esc(sp)}» חזר 3 פעמים לאחרונה. רוצה אתגר קצר של 3 ימים כדי לשבור אותו?</p>
        <div class="step-actions">
          <button type="button" class="btn btn--ghost" data-ch-dismiss>לא עכשיו</button>
          <button type="button" class="btn btn--primary" data-ch-start>מתחילים 🎯</button>

  function wireDailyExtras(root) {
    const ed = $("[data-identity-edit]", root);
    if (ed) ed.addEventListener("click", () => openIdentityModal(() => renderShell()));

    const start = $("[data-ch-start]", root);
    if (start) start.addEventListener("click", () => {
      const sp = $("[data-suggest]", root).dataset.suggest;
      startChallenge(sp);
      toast("יצאנו לדרך — אתגר 3 ימים 🎯");
      renderDaily($("[data-view]"));
    });
    const dismiss = $("[data-ch-dismiss]", root);
    if (dismiss) dismiss.addEventListener("click", () => {
      dismissChallenge($("[data-suggest]", root).dataset.suggest);
      renderDaily($("[data-view]"));
    });
    $$("[data-ch-day]", root).forEach((btn) => btn.addEventListener("click", () => {
      const ch = activeChallenge();
      if (!ch) return;
      toggleChallengeDay(ch, Number(btn.dataset.chDay));
      if (ch.status === "done") {
        celebrate({ emoji: "💪", title: "אתגר הושלם!", sub: "שברת את הדפוס. זה אתֿ/ה החדש/ה." });
      }
      $("[data-streak]").textContent = `🔥 ${computeStreak()}`;
      renderDaily($("[data-view]"));
    }));
  }

  /* ----- Login ----- */
  function renderLogin() {
    app.innerHTML = "";
    app.appendChild(tpl("tpl-login"));
    const form = $("#login-form");

    // בחירת מגדר (פנייה)
    let gender = "f";
    $$("[data-gender]", form).forEach((chip) => {
      chip.addEventListener("click", () => {
        gender = chip.dataset.gender;
        $$("[data-gender]", form).forEach((c) => c.classList.toggle("is-selected", c === chip));
      });
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const email = String(fd.get("email")).trim();
      const name = String(fd.get("name")).trim();
      if (!email || !name) return;
      const user = Store.loadUser(email);
      user.name = name;
      user.gender = gender;
      Store.saveUser(user);
      Store.setSession(email);
      state.user = user;
      state.view = "daily";
      render();
      scheduleReminder();
    });
  }

  /* ----- Shell ----- */
  function renderShell() {
    app.innerHTML = "";
    app.appendChild(tpl("tpl-shell"));

    $("[data-username]").textContent = state.user.name;
    $("[data-streak]").textContent = `🔥 ${computeStreak()}`;
    const verEl = $("[data-ver]"); if (verEl) verEl.textContent = "v" + APP_VERSION;
    const refreshBtn = $("[data-refresh]");
    if (refreshBtn) refreshBtn.addEventListener("click", () => {
      // טעינה מחדש שעוקפת cache — מביאה תמיד את הגרסה האחרונה
      const base = location.href.split("?")[0].split("#")[0];
      location.replace(base + "?v=" + Date.now());
    });
    $("[data-reminder-open]").addEventListener("click", openReminderModal);
    updateBell();
    $("[data-logout]").addEventListener("click", () => {
      Store.clearSession();
      state.user = null;
      render();
    });

    $$(".navbtn").forEach((btn) => {
      btn.classList.toggle("is-active", btn.dataset.nav === state.view);
      btn.addEventListener("click", () => {
        state.view = btn.dataset.nav;
        if (state.view === "daily") { state.draft = null; state.step = 0; }
        renderShell();
      });
    });

    const views = {
      daily: renderDaily,
      mantra: renderMantra,
      gratitude: renderGratitude,
      patterns: renderPatterns,
      weekly: renderWeekly,
      history: renderHistory,
    };
    (views[state.view] || renderDaily)($("[data-view]"));
  }

  /* ----- Daily Flow ----- */
  function renderDaily(root) {
    const existing = getEntry(todayKey());

    // אם כבר הושלם היום — מציגים מסך "בוצע"
    if (existing && existing.completed && !state.draft) {
      return renderDailyDone(root, existing);
    }

    if (!state.draft) {
      state.draft = existing ? { ...existing } : blankDraft();
      state.step = 0;
    }

    const d = state.draft;
    const extras = state.step === 0 ? northStarHtml() + challengeCardHtml() : "";
    root.innerHTML = `
      <div class="view-head">
        <h2>Daily Reset</h2>
        <p>${esc(fmtDate(d.date))} · 5 דקות לגרסה הבאה שלך</p>

      ${extras}
      <div class="progress">
        ${Array.from({ length: STEPS }, (_, i) =>
          `<div class="progress__dot ${i < state.step ? "is-done" : ""} ${i === state.step ? "is-current" : ""}"></div>`
        ).join("")}
      </div>
      <div class="card" data-step-card></div>

    renderStep($("[data-step-card]", root));
    if (state.step === 0) wireDailyExtras(root);

        <div class="step__kicker">שלב 5 מתוך 5</div>
        <h3 class="step__title">חיזוק זהות</h3>
        <p class="step__hint">${gx({ f: "קחי נשימה. קראי את המשפט הזה לעצמך.", m: "קח נשימה. קרא את המשפט הזה לעצמך.", n: "רגע של נשימה. קריאת המשפט הזה לעצמך." })}</p>
        <div class="affirm-card">
          <div class="affirm-card__quote">“${esc(d.affirmation)}”</div>
          <div class="affirm-card__by">${gx({ f: "— הזהות שאת בונה", m: "— הזהות שאתה בונה", n: "— הזהות שבונים" })}</div>
        </div>
        <button type="button" class="btn btn--ghost btn--block" data-shuffle>🔀 משפט אחר</button>
      `,
    ];

    card.innerHTML = steps[state.step]() + navHtml();
    wireStep(card);
  }

  function navHtml() {
    const last = state.step === STEPS - 1;
    return `
      <div class="step-actions">
        ${state.step > 0 ? `<button type="button" class="btn btn--ghost" data-back>חזרה</button>` : ""}
        <button type="button" class="btn btn--primary" data-next>${last ? "סיום וסיכום ✓" : "הבא →"}</button>
      </div>
    `;
  }

  function syncInputs(card) {
    $$("[data-input]", card).forEach((el) => {
      state.draft[el.dataset.input] = el.value;
    });
  }

  function wireStep(card) {
    // chips (step 0)
    $$("[data-pattern]", card).forEach((chip) => {
      chip.addEventListener("click", () => {
        state.draft.pattern = chip.dataset.pattern;
        renderStep(card);
      });
    });
    // live sync
    $$("[data-input]", card).forEach((el) => {
      el.addEventListener("input", () => { state.draft[el.dataset.input] = el.value; });
    });
    // shuffle affirmation
    const sh = $("[data-shuffle]", card);
    if (sh) sh.addEventListener("click", () => {
      let a;
      do { a = randAffirmation(); }
      while (a === state.draft.affirmation && affirmations().length > 1);
      state.draft.affirmation = a;
      renderStep(card);
    });

    const back = $("[data-back]", card);
    if (back) back.addEventListener("click", () => {
      syncInputs(card);
      state.step--;
      renderDaily($("[data-view]"));
    });

    $("[data-next]", card).addEventListener("click", () => {
      syncInputs(card);
      if (!validateStep()) return;
      if (state.step < STEPS - 1) {
        state.step++;
        renderDaily($("[data-view]"));
      } else {
        state.draft.completed = true;
        saveEntry({ ...state.draft });
        const id = state.user.identity;
        celebrate({
          emoji: "🎉",
          title: "כל הכבוד! סיימת להיום",
          sub: id ? `עוד צעד אל «${id}»` : "עוד צעד אל הגרסה הבאה שלך",
        });
        state.draft = null;
        state.step = 0;
        renderShell();
      }
    });
  }

  function validateStep() {
    const d = state.draft;
    const need = (val, msg) => { if (!String(val).trim()) { toast(msg); return false; } return true; };
    switch (state.step) {
      case 0: return need(d.pattern, "כדאי לבחור או לכתוב דפוס אחד");
      case 1:
        if (!need(d.trigger, "מה היה הטריגר?")) return false;
        if (!need(d.thought, "מה הייתה המחשבה?")) return false;
        return need(d.oldAction, "מה עשית בפועל?");
      case 2: return need(d.identityAction, "איך הגרסה הבטוחה הייתה פועלת?");
      case 3: return need(d.oneAction, "מה הפעולה האחת להיום?");
      default: return true;
    }
  }

  function renderDailyDone(root, entry) {
    root.innerHTML = `
      <div class="view-head">
        <h2>Daily Reset</h2>
        <p>${esc(fmtDate(entry.date))}</p>
      </div>
      ${northStarHtml()}
      ${challengeCardHtml()}
      <div class="card done">
        <div class="done__emoji">✅</div>
        <div class="done__title">סיימת את האימון להיום</div>
        <p class="done__sub">🔥 ${streakText(computeStreak())}</p>
        <div class="comeback">🔁 ${gx({ f: "תחזרי מחר לתרגול הבא", m: "תחזור מחר לתרגול הבא", n: "נתראה מחר לתרגול הבא" })}</div>
        <div class="affirm-card">
          <div class="affirm-card__quote">“${esc(entry.affirmation)}”</div>
        </div>
        <div class="history-item__row" style="text-align:right;margin-top:18px">
          <b>הפעולה שלך להיום:</b><br>${esc(entry.oneAction)}
        </div>
        <div class="step-actions">
          <label class="btn btn--ghost" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px">
            <input type="checkbox" data-action-done ${entry.actionDone ? "checked" : ""} style="width:auto;margin:0">
            ביצעתי את הפעולה
          </label>
          <button type="button" class="btn btn--primary" data-edit>עריכה</button>
        </div>
      </div>
    `;
    $("[data-action-done]", root).addEventListener("change", (e) => {
      entry.actionDone = e.target.checked;
      saveEntry(entry);
      toast(entry.actionDone ? "מעולה — פעולה בוצעה 💪" : "סומן כלא בוצע");
    });
    $("[data-edit]", root).addEventListener("click", () => {
      state.draft = { ...entry };
      state.step = 0;
      renderDaily(root);
    });
    wireDailyExtras(root);
  }

  /* ----- Gratitude ----- */
  function renderGratitude(root) {
    const todayRec = getGratitude(todayKey());
    const past = state.user.gratitude.filter((g) => g.date !== todayKey());
    const items = todayRec ? [...todayRec.items, "", ""].slice(0, Math.max(3, todayRec.items.length + 1)) : ["", "", ""];

    root.innerHTML = `
      <div class="view-head">
        <h2>הכרת תודה</h2>
        <p>רגע קטן של תודה ביום משנה את מה שאת רואה. ✨</p>
      </div>

      <div class="grat-hero">
        <p class="grat-hero__title">${todayRec ? "התודות שלך להיום 🌼" : gx({ f: "על מה את אסירת תודה היום?", m: "על מה אתה אסיר תודה היום?", n: "על מה כדאי להגיד תודה היום?" })}</p>
        <p class="grat-hero__sub">שלושה דברים — קטנים או גדולים, הכול נחשב.</p>
      </div>

      <div class="card">
        <div class="grat-fields" data-grat-fields>
          ${items.map((v, i) => `
            <div class="grat-input-wrap" data-num="${i + 1}">
              <input type="text" data-grat value="${esc(v)}" placeholder="${esc(gratPrompts()[i % gratPrompts().length])}" />
            </div>`).join("")}
        </div>
        <div class="step-actions">
          <button type="button" class="btn btn--ghost" data-grat-add>+ עוד שורה</button>
          <button type="button" class="btn btn--gold" data-grat-save>${todayRec ? "עדכון" : "שמירה"} 🌟</button>
        </div>
      </div>

      <div class="stat-row" style="margin-top:24px">
        <div class="stat"><div class="stat__num">${gratitudeStreak()}</div><div class="stat__label">ימים רצופים 🌼</div></div>
        <div class="stat"><div class="stat__num">${gratitudeTotal()}</div><div class="stat__label">תודות שנכתבו</div></div>
        <div class="stat"><div class="stat__num">${state.user.gratitude.length}</div><div class="stat__label">ימים של תודה</div></div>
      </div>

      <h3 style="margin:6px 0 14px">קיר ההכרת תודה</h3>
      ${past.length === 0
        ? emptyHtml("הקיר עוד ריק", "כל מה שכותבים כאן יישמר ויצטבר לקיר תודה אישי.")
        : `<div class="grat-wall">
            ${past.flatMap((g) => g.items.map((it) => `
              <div class="grat-note">
                <div class="grat-note__pin">📌</div>
                <div class="grat-note__text">${esc(it)}</div>
                <div class="grat-note__date">${esc(fmtDate(g.date))}</div>
              </div>`)).join("")}
          </div>`}
    `;

    $("[data-grat-add]", root).addEventListener("click", () => {
      const wrap = $("[data-grat-fields]", root);
      const n = $$("[data-grat]", wrap).length + 1;
      const div = document.createElement("div");
      div.className = "grat-input-wrap";
      div.setAttribute("data-num", n);
      div.innerHTML = `<input type="text" data-grat placeholder="${esc(gratPrompts()[(n - 1) % gratPrompts().length])}" />`;
      wrap.appendChild(div);
      div.querySelector("input").focus();
    });

    $("[data-grat-save]", root).addEventListener("click", () => {
      const vals = $$("[data-grat]", root).map((el) => el.value);
      if (vals.every((v) => !v.trim())) { toast("כדאי לכתוב לפחות דבר אחד 🙂"); return; }
      saveGratitude(vals);
      $("[data-streak]").textContent = `🔥 ${computeStreak()}`;
      toast("נשמר. תודה היא שריר — וכל יום מאמנים אותו 🌟");
      renderGratitude(root);
    });
  }

  /* ----- Daily Mantra ----- */
  function renderMantra(root) {
    const rec = getMantraRec(todayKey());
    const am = activeMantra();
    const mantraText = (rec && rec.mantra) ? rec.mantra : am.text;
    const focus = (rec && rec.focus) ? rec.focus : am.focus;
    const count = rec ? rec.count : 0;
    const complete = count >= 5;

    root.innerHTML = `
      <div class="view-head">
        <h2>המנטרה היומית</h2>
        <p>להגיד בקול 5 פעמים — ולסמן כל אמירה. ✨</p>
      </div>
      <div class="mantra-focus-wrap">
        <span class="mantra-focus">🎯 המיקוד שלך · ${esc(focus)}</span>
        <button type="button" class="mantra-edit" data-mantra-edit>✎ מנטרה משלי</button>
      </div>

      <div class="mantra-card ${complete ? "is-complete" : ""}" data-mantra-card>
        <div class="mantra-card__quote">“${esc(mantraText)}”</div>
        <div class="mantra-orbs">
          ${[0, 1, 2, 3, 4].map((i) => `<span class="orb ${i < count ? "is-on" : ""}"></span>`).join("")}
        </div>
      </div>

      ${complete
        ? `<div class="mantra-done">
             <div class="mantra-done__title">5 מתוך 5 — מושלם! 🎉</div>
             <p class="mantra-done__sub">${gx({ f: "המנטרה מושרשת בך היום. תחזרי מחר 🔁", m: "המנטרה מושרשת בך היום. תחזור מחר 🔁", n: "המנטרה מושרשת היום. נתראה מחר 🔁" })}</p>
             <button type="button" class="btn btn--ghost btn--block" data-mantra-again>סבב נוסף 🔁</button>
           </div>`
        : `<button type="button" class="btn btn--primary btn--block mantra-say" data-mantra-tap>אמרתי <b>${count}/5</b> 🔁</button>`}

      <div class="stat-row" style="margin-top:24px">
        <div class="stat"><div class="stat__num">${mantraStreak()}</div><div class="stat__label">ימים רצופים ✨</div></div>
        <div class="stat"><div class="stat__num">${mantraTotal()}</div><div class="stat__label">פעמים שנאמרו</div></div>
        <div class="stat"><div class="stat__num">${state.user.mantras.filter((m) => m.done).length}</div><div class="stat__label">ימים שהושלמו</div></div>
      </div>
    `;

    const tapBtn = $("[data-mantra-tap]", root);
    if (tapBtn) tapBtn.addEventListener("click", () => {
      const r = tapMantra();
      if (r.count >= 5) {
        if (navigator.vibrate) { try { navigator.vibrate([0, 35, 25, 35, 25, 70]); } catch (_) {} }
        celebrate({ emoji: "💫", title: "5 פעמים! 🎉", sub: "המנטרה שלך מושרשת היום" });
      } else if (navigator.vibrate) {
        try { navigator.vibrate(18); } catch (_) {}
      }
      renderMantra(root);
    });
    const again = $("[data-mantra-again]", root);
    if (again) again.addEventListener("click", () => { resetMantraRound(); renderMantra(root); });
    const edit = $("[data-mantra-edit]", root);
    if (edit) edit.addEventListener("click", () => openMantraModal(() => renderMantra(root)));
  }

  /* ----- Pattern Tracker ----- */
  function renderPatterns(root) {
    const stats = patternStats(7);
    const total = stats.reduce((s, p) => s + p.count, 0);
    const allTime = patternStats(3650);
    const max = stats[0] ? stats[0].count : 1;

    root.innerHTML = `
      <div class="view-head">
        <h2>Pattern Tracker</h2>
        <p>הדפוסים שמנהלים אותך השבוע — בלי לשפוט, רק לראות.</p>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="stat__num">${total}</div><div class="stat__label">תרגולים השבוע</div></div>
        <div class="stat"><div class="stat__num">${stats.length}</div><div class="stat__label">דפוסים שונים</div></div>
        <div class="stat"><div class="stat__num">${computeStreak()}</div><div class="stat__label">רצף ימים 🔥</div></div>
      </div>
      <h3 style="margin:0 0 14px">Top 3 דפוסים השבוע</h3>
      ${stats.length === 0 ? emptyHtml("עוד אין מספיק נתונים", "השלימי כמה ימים של אימון כדי לזהות דפוסים חוזרים.") : `
        <div class="pattern-list">
          ${stats.slice(0, 3).map((p, i) => patternRow(p, i, max)).join("")}
        </div>`}
      ${allTime.length > 3 ? `
        <h3 style="margin:28px 0 14px">כל הדפוסים (מאז ומתמיד)</h3>
        <div class="pattern-list">
          ${allTime.map((p) => patternRow(p, -1, allTime[0].count)).join("")}
        </div>` : ""}
    `;
  }

  function patternRow(p, rank, max) {
    const medals = ["🥇", "🥈", "🥉"];
    const pct = Math.max(8, Math.round((p.count / max) * 100));
    return `
      <div class="pattern-item">
        <div class="pattern-item__top">
          <div class="pattern-item__name">${rank >= 0 ? `<span class="rank">${medals[rank] || ""}</span>` : ""}${esc(p.name)}</div>
          <div class="pattern-item__count">${p.count} ${p.count === 1 ? "פעם" : "פעמים"}</div>
        </div>
        <div class="bar"><div class="bar__fill" style="width:${pct}%"></div></div>
      </div>`;
  }

  /* ----- Weekly Summary ----- */
  function renderWeekly(root) {
    const s = weeklySummary();
    root.innerHTML = `
      <div class="view-head">
        <h2>סיכום שבועי</h2>
        <p>7 הימים האחרונים — מה השתנה.</p>
      </div>
      <div class="summary-hero">
        <h3>הדפוס הכי חזק השבוע</h3>
        <div class="big">${s.topPattern ? esc(s.topPattern.name) : "— עוד אין נתונים —"}</div>
        ${s.topPattern ? `<p style="margin:6px 0 0;color:var(--muted)">הופיע ${s.topPattern.count} פעמים. זה המקום למקד בו תשומת לב.</p>` : ""}
      </div>
      <div class="stat-row">
        <div class="stat"><div class="stat__num">${s.practiced}</div><div class="stat__label">ימי תרגול</div></div>
        <div class="stat"><div class="stat__num">${s.actionsDone}</div><div class="stat__label">פעולות שבוצעו</div></div>
        <div class="stat"><div class="stat__num">${s.practiced ? Math.round((s.actionsDone / s.practiced) * 100) : 0}%</div><div class="stat__label">אחוז ביצוע</div></div>
      </div>
      ${s.lastAction ? `
        <div class="card">
          <h3 style="margin:0 0 8px;font-size:15px;color:var(--muted)">מה השתנה בפעולה — הצעד האחרון שלך</h3>
          <div style="font-size:17px;line-height:1.6">${esc(s.lastAction)}</div>
        </div>` : ""}
      ${s.practiced === 0 ? emptyHtml("השבוע עוד לא התחיל", "השלימי את האימון של היום כדי שהסיכום יתמלא.") : ""}
    `;
  }

  /* ----- History ----- */
  function renderHistory(root) {
    const entries = state.user.entries.filter((e) => e.completed);
    root.innerHTML = `
      <div class="view-head">
        <h2>היסטוריה</h2>
        <p>${entries.length} תרגולים שהשלמת. כל אחד הוא הצבעה לזהות שלך.</p>
      </div>
      ${entries.length === 0
        ? emptyHtml("עוד אין היסטוריה", "האימון הראשון שלך יופיע כאן.")
        : entries.map(historyItem).join("")}
    `;
  }

  function historyItem(e) {
    return `
      <div class="history-item">
        <div class="history-item__date">
          <span>${esc(fmtDate(e.date))}</span>
          <span class="${e.actionDone ? "badge-done" : "badge-skip"}">${e.actionDone ? "✓ פעולה בוצעה" : "○ פעולה לא סומנה"}</span>
        </div>
        <span class="history-item__pattern">🔁 ${esc(e.pattern)}</span>
        <div class="history-item__row"><b>טריגר:</b> ${esc(e.trigger)}</div>
        <div class="history-item__row"><b>מחשבה:</b> ${esc(e.thought)}</div>
        <div class="history-item__row"><b>הגרסה הבטוחה:</b> ${esc(e.identityAction)}</div>
        <div class="history-item__row"><b>פעולה להיום:</b> ${esc(e.oneAction)}</div>
      </div>`;
  }

  function emptyHtml(title, sub) {
    return `<div class="empty"><div class="empty__emoji">🌱</div><h3>${esc(title)}</h3><p>${esc(sub)}</p></div>`;
  }

  /* ------------------------------ Boot --------------------------------- */

  function boot() {
    const email = Store.getSession();
    if (email) state.user = Store.loadUser(email);
    render();
    if (state.user) scheduleReminder();
  }

  boot();
})();

</script>

</html>
